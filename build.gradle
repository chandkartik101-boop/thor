plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '1.0.0'
group = 'com.heroesthor.gta'
base { archivesName = 'heroesthor_gta' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs { client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { heroesthor_gta { source sourceSets.main } } } }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.named('jar') { finalizedBy 'reobfJar' }
